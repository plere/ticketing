server:
  port: 8082

spring:
  application:
    name: waiting-service
  profiles:
    include:
      - resource
  data:
    redis:
      host: 127.0.0.1
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true

external:
  client:
    concert:
      url: http://localhost:8080